name: Packages

# Construye y VERIFICA los paquetes distribuibles: instaladores de Windows
# (amd64 y arm64), AppImage de Linux y los agentes. El release los reutiliza
# (workflow_call), de modo que lo que se publica es exactamente lo que se probo.

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v2.13.0

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that every declared version matches
        id: check
        run: echo "version=$(bash scripts/check-version.sh)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- Agentes
  agents:
    name: Agent bundles (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build agent
        working-directory: agent
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          if [ "$GOOS" = "windows" ]; then out=lan-agent.exe; else out=lan-agent-linux; fi
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/bundle/$out" ./cmd/lan-agent

      - name: Bundle with its installer
        run: |
          mkdir -p dist
          name="lan-commander-agent-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp installers/windows/install-agent.ps1 "$RUNNER_TEMP/bundle/"
            (cd "$RUNNER_TEMP/bundle" && zip -q "$GITHUB_WORKSPACE/dist/${name}.zip" lan-agent.exe install-agent.ps1)
          else
            cp installers/linux/install-agent.sh "$RUNNER_TEMP/bundle/"
            chmod 755 "$RUNNER_TEMP/bundle/install-agent.sh" "$RUNNER_TEMP/bundle/lan-agent-linux"
            tar -C "$RUNNER_TEMP/bundle" -czf "dist/${name}.tar.gz" lan-agent-linux install-agent.sh
          fi
          ls -l dist

      - name: Smoke test (native Linux amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: bash scripts/smoke-agent.sh "$RUNNER_TEMP/bundle/lan-agent-linux"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------- Windows amd64 / arm64
  windows-app:
    name: Windows installer (${{ matrix.arch }})
    runs-on: windows-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: control-center/go.mod
          cache-dependency-path: control-center/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-center/frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (Test-Path $nsis) { $nsis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }

      - name: Build installer
        shell: pwsh
        working-directory: control-center
        run: wails build -clean -platform windows/${{ matrix.arch }} -nsis -o lan-commander.exe

      - name: Check the application architecture
        shell: pwsh
        run: .\scripts\test-windows-installer.ps1 -Mode Inspect -Architecture ${{ matrix.arch }} -AppExe control-center\build\bin\lan-commander.exe

      - name: Install, upgrade and uninstall keeping user data (amd64 runs natively here)
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          $installer = Get-ChildItem control-center\build\bin -Filter '*-installer.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer was produced.' }
          .\scripts\test-windows-installer.ps1 -Mode Cycle -Architecture amd64 -Installer $installer.FullName

      - name: Name the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $installer = Get-ChildItem control-center\build\bin -Filter '*-installer.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer was produced.' }
          Copy-Item $installer.FullName "dist\LAN-Commander-$env:VERSION-windows-${{ matrix.arch }}-setup.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-installer
          path: dist/*
          if-no-files-found: error

  # Prueba NATIVA en Windows ARM64: instala el paquete construido arriba, ejecuta
  # el agente real y los tests de los dos modulos en esa arquitectura.
  windows-arm64-native:
    name: Windows ARM64 (native runner)
    runs-on: windows-11-arm
    needs: [version, windows-app, agents]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the ARM64 installer
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64-installer
          path: arm64-installer

      - name: Download the ARM64 agent bundle
        uses: actions/download-artifact@v4
        with:
          name: agent-windows-arm64
          path: arm64-agent

      - name: Install, upgrade and uninstall keeping user data
        shell: pwsh
        run: |
          $installer = Get-ChildItem arm64-installer -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The ARM64 installer artifact is empty.' }
          .\scripts\test-windows-installer.ps1 -Mode Cycle -Architecture arm64 -Installer $installer.FullName

      - name: Unpack the ARM64 agent bundle
        shell: pwsh
        run: |
          $zip = Get-ChildItem arm64-agent -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'The ARM64 agent artifact is empty.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath arm64-agent/unpacked
          .\scripts\test-windows-installer.ps1 -Mode Inspect -Architecture arm64 -AppExe arm64-agent/unpacked/lan-agent.exe

      - name: Run the ARM64 agent
        shell: bash
        run: bash scripts/smoke-agent.sh "$PWD/arm64-agent/unpacked/lan-agent.exe"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Agent tests on ARM64
        working-directory: agent
        run: go test ./... -count=1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-center/frontend/package-lock.json

      - name: Build embedded frontend
        working-directory: control-center/frontend
        run: |
          npm ci
          npm run build

      - name: Control Center tests on ARM64
        working-directory: control-center
        run: go test ./... -count=1

  # ------------------------------------------------------------- Linux AppImage
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: control-center/go.mod
          cache-dependency-path: control-center/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-center/frontend/package-lock.json

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb dbus-x11 sqlite3 desktop-file-utils

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build the Linux binary
        working-directory: control-center
        run: wails build -clean -platform linux/amd64 -tags webkit2_41 -o lan-commander

      - name: Package the AppImage
        run: bash scripts/build-appimage.sh "$VERSION" control-center/build/bin/lan-commander "dist/LAN-Commander-${VERSION}-linux-x86_64.AppImage"

      - name: Verify the AppImage structure
        run: |
          appimage="dist/LAN-Commander-${VERSION}-linux-x86_64.AppImage"
          test -x "$appimage"
          file "$appimage" | grep -q 'ELF 64-bit'
          export APPIMAGE_EXTRACT_AND_RUN=1
          rm -rf squashfs-root
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/lan-commander
          desktop-file-validate squashfs-root/lan-commander.desktop
          grep -q "X-AppImage-Version=${VERSION}" squashfs-root/lan-commander.desktop
          echo "AppImage extracts and its desktop entry is valid."

      - name: Start the app and upgrade an existing data directory
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # CI runners forbid the unprivileged user namespaces WebKit's sandbox needs.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          appimage="$PWD/dist/LAN-Commander-${VERSION}-linux-x86_64.AppImage"
          export HOME="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          data="$XDG_CONFIG_HOME/LAN Commander"
          mkdir -p "$data"

          # A database as an older release would have left it (original schema).
          sqlite3 "$data/lan-commander.db" "
            CREATE TABLE sessions (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              name TEXT NOT NULL DEFAULT '',
              host TEXT NOT NULL,
              port INTEGER NOT NULL,
              auth_token TEXT NOT NULL DEFAULT '',
              created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
              last_connected DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
              UNIQUE(host, port));
            INSERT INTO sessions (name, host, port) VALUES ('legacy-session', '192.0.2.10', 9474);"

          # timeout exits 124 when the app is still running at the deadline.
          set +e
          xvfb-run -a --server-args="-screen 0 1280x800x24" dbus-run-session -- timeout 25 "$appimage" > "$RUNNER_TEMP/app.log" 2>&1
          code=$?
          set -e
          echo "---- application output ----"; cat "$RUNNER_TEMP/app.log" || true; echo "----------------------------"
          if [ "$code" -ne 124 ]; then
            echo "The application exited early with code $code instead of staying up." >&2
            exit 1
          fi

          # The previous data must be intact, migrated, and backed up before migrating.
          backup="$data/lan-commander.db.bak-${VERSION}"
          test -f "$backup" || { echo "No pre-upgrade backup was created." >&2; exit 1; }
          test "$(sqlite3 "$backup" 'SELECT COUNT(*) FROM sessions')" = "1"
          test "$(sqlite3 "$backup" "SELECT COUNT(*) FROM pragma_table_info('sessions') WHERE name='tls_enabled'")" = "0"
          test "$(sqlite3 "$data/lan-commander.db" "SELECT name FROM sessions WHERE host='192.0.2.10'")" = "legacy-session"
          test "$(sqlite3 "$data/lan-commander.db" "SELECT COUNT(*) FROM pragma_table_info('sessions') WHERE name='tls_enabled'")" = "1"
          echo "Existing data survived: migrated in place and backed up first."

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
